[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "odordiff"
version = "2.0.0"
description = "Advanced olfactory molecule generation with synthesizability scoring and VSCode integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["olfaction", "molecule generation", "diffusion", "cheminformatics"]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
odordiff = "odordiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
